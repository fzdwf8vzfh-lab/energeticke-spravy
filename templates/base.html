<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Energetické správy{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f4; color: #1a2e1a; }

        nav {
            background: #1a3a2a;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }
        nav .logo { color: #fff; font-weight: 700; font-size: 1.1rem; text-decoration: none; }
        nav .nav-links { display: flex; gap: 1rem; }
        nav .nav-links a {
            color: #a8d5b5;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        nav .nav-links a:hover { background: #2c5a3a; color: #fff; }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            margin-bottom: 1.5rem;
        }

        h1 { font-size: 1.6rem; color: #1a3a2a; margin-bottom: 1.5rem; }
        h2 { font-size: 1.2rem; color: #2c5a3a; margin-bottom: 1rem; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a6a4a; margin-bottom: 0.4rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #c8e0c8;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border 0.2s;
            background: #f9fcf9;
        }
        input:focus, select:focus { outline: none; border-color: #2c7a4b; background: #fff; }

        .btn {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #2c7a4b; color: #fff; }
        .btn-primary:hover { background: #1a5c35; }
        .btn-secondary { background: #e8f4ec; color: #2c7a4b; }
        .btn-secondary:hover { background: #d0ebd9; }
        .btn-outline { background: transparent; color: #2c7a4b; border: 1.5px solid #2c7a4b; }
        .btn-outline:hover { background: #2c7a4b; color: #fff; }

        .alert { padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: #fde8e8; color: #c0392b; border: 1px solid #f5c6cb; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

        .section-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #2c7a4b;
            margin: 1.5rem 0 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #e8f4ec;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #1a3a2a; color: #fff; padding: 0.7rem 1rem; text-align: left; }
        td { padding: 0.7rem 1rem; border-bottom: 1px solid #e8f4ec; }
        tr:hover td { background: #f4faf6; }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-audit { background: #d4edff; color: #1565c0; }
        .badge-certifikat { background: #fff3cd; color: #856404; }
        .badge-vykurovanie { background: #fde8e8; color: #c0392b; }

        @media (max-width: 600px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
{% if session.logged_in %}
<nav>
    <a href="{{ url_for('dashboard') }}" class="logo">⚡ Energetické správy</a>
    <div class="nav-links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('audit') }}">Audit</a>
        <a href="{{ url_for('certifikat') }}">Certifikát</a>
        <a href="{{ url_for('vykurovanie') }}">Vykurovanie</a>
        <a href="{{ url_for('historia') }}">História</a>
        <a href="{{ url_for('logout') }}">Odhlásiť</a>
    </div>
</nav>
{% endif %}
<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-error">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
