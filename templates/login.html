{% extends 'base.html' %}
{% block title %}Prihlásenie{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;">
    <div class="card">
        <h1 style="text-align:center;margin-bottom:0.5rem;">⚡ Prihlásenie</h1>
        <p style="text-align:center;color:#7a9a7a;margin-bottom:2rem;font-size:0.9rem;">Zadajte prihlasovacie údaje</p>
        <form method="POST">
            <div class="form-group">
                <label>Používateľské meno</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Prihlásiť sa</button>
        </form>
    </div>
</div>
{% endblock %}
